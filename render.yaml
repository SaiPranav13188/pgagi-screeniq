# Render Blueprint: FastAPI backend + Postgres.
# Secrets are declared with `sync: false` - Render asks for them in the dashboard and stores
# them encrypted; they never live in this repository.
databases:
  - name: screeniq-db
    plan: free
    databaseName: screeniq
    user: screeniq

services:
  - type: web
    name: screeniq-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.fetch_kb
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: screeniq-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3-flash-preview,gemini-3.5-flash-lite
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: KB_REPO
        sync: false
      - key: KB_REPO_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
